<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlyChek — Eco-Banana Stem Cassava Packaging</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* ========================================================================
1. CSS VARIABLES & APPLE GLASS THEME TOKENS
         ======================================================================== */
      :root {
        --bg-page: #f4f9f5;
        --bg-alt: #e9f4ec;
        --bg-card: rgba(255, 255, 255, 0.72);
        --border-card: rgba(22, 128, 60, 0.28);
        --text-main: #13221a;
        --text-muted: #466051;

        --green-dark: #05442f;
        --green-mid: #0d6236;
        --green-primary: #16803c;
        --green-bright: #35b85a;
        --green-lime: #a3d977;

        /* Apple Liquid Glass Tokens (Light Mode) */
        --glass-bg: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.34) 0%,
          rgba(255, 255, 255, 0.12) 55%,
          rgba(163, 217, 119, 0.18) 100%
        );
        --glass-card-bg: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.86) 0%,
          rgba(244, 251, 246, 0.66) 100%
        );
        --glass-border: rgba(255, 255, 255, 0.55);
        --glass-specular:
          0 16px 38px rgba(6, 78, 54, 0.12),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.85),
          inset 0 -1px 1px rgba(22, 128, 60, 0.1);

        /* Frosted Glass Navbar Tokens (Light Mode) */
        --nav-scrolled-bg: rgba(255, 255, 255, 0.68);
        --nav-scrolled-border: rgba(255, 255, 255, 0.75);
        --nav-scrolled-shadow:
          0 12px 32px rgba(6, 78, 54, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --nav-text-scrolled: #13221a;
        --control-bg-scrolled: rgba(255, 255, 255, 0.65);
        --control-border-scrolled: rgba(22, 128, 60, 0.22);

        --team-avatar-bg: #f3faf5;
        --footer-bg: #042b1e;
        --footer-border: #0c4c36;
        --footer-text: #e6f4ec;

        --spring-ease: cubic-bezier(0.22, 1, 0.36, 1);

        --font-sans:
          "Inter", "Kantumruy Pro", system-ui, -apple-system, sans-serif;
        --font-display: "Poppins", "Kantumruy Pro", system-ui, sans-serif;
        --font-khmer: "Kantumruy Pro", "Inter", system-ui, sans-serif;
      }

      body.dark {
        --bg-page: #08120d;
        --bg-alt: #0c1913;
        --bg-card: rgba(17, 33, 25, 0.68);
        --border-card: rgba(163, 217, 119, 0.32);
        --text-main: #eaf4ed;
        --text-muted: #a8c2b1;

        /* Apple Liquid Glass Tokens (Dark Mode) */
        --glass-bg: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.14) 0%,
          rgba(255, 255, 255, 0.04) 55%,
          rgba(163, 217, 119, 0.12) 100%
        );
        --glass-card-bg: linear-gradient(
          145deg,
          rgba(22, 42, 32, 0.78) 0%,
          rgba(13, 26, 19, 0.62) 100%
        );
        --glass-border: rgba(255, 255, 255, 0.2);
        --glass-specular:
          0 18px 42px rgba(0, 0, 0, 0.45),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.24),
          inset 0 -1px 1px rgba(163, 217, 119, 0.1);

        /* Frosted Glass Navbar Tokens (Dark Mode) */
        --nav-scrolled-bg: rgba(9, 19, 14, 0.68);
        --nav-scrolled-border: rgba(163, 217, 119, 0.24);
        --nav-scrolled-shadow:
          0 12px 32px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        --nav-text-scrolled: #eaf4ed;
        --control-bg-scrolled: rgba(17, 33, 25, 0.65);
        --control-border-scrolled: rgba(163, 217, 119, 0.25);

        --team-avatar-bg: #112119;
        --footer-bg: #050c09;
        --footer-border: #1a3024;
        --footer-text: #d8e9df;
      }

      /* ========================================================================
2. KEYFRAME ANIMATIONS (AURORA + BANANA TREE SWAY + CASSAVA FLOAT)
         ======================================================================== */
      @keyframes bgAuroraShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes bananaSway {
        0%,
        100% {
          transform: rotate(-2.8deg) translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: rotate(3.2deg) translate3d(10px, -12px, 0) scale(1.035);
        }
      }

      @keyframes bananaSwayFlipped {
        0%,
        100% {
          transform: scaleX(-1) rotate(-2.5deg) translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: scaleX(-1) rotate(3deg) translate3d(-10px, -10px, 0)
            scale(1.035);
        }
      }

      @keyframes cassavaFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0) rotate(-3.5deg) scale(1);
        }
        35% {
          transform: translate3d(14px, -18px, 0) rotate(2.5deg) scale(1.045);
        }
        70% {
          transform: translate3d(-10px, -8px, 0) rotate(-1.5deg) scale(0.98);
        }
      }

      @keyframes cassavaFloatFlipped {
        0%,
        100% {
          transform: scaleX(-1) translate3d(0, 0, 0) rotate(-3deg) scale(1);
        }
        40% {
          transform: scaleX(-1) translate3d(-14px, -16px, 0) rotate(2.5deg)
            scale(1.04);
        }
        75% {
          transform: scaleX(-1) translate3d(8px, -6px, 0) rotate(-1deg)
            scale(0.985);
        }
      }

      @keyframes gentleBob {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-7px);
        }
      }

      /* ========================================================================
3. RESET & BASE STYLES
         ======================================================================== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-page);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
        transition:
          background-color 0.4s var(--spring-ease),
          color 0.4s var(--spring-ease);
      }

      body.lang-km,
      body.lang-km h1,
      body.lang-km h2,
      body.lang-km h3 {
        font-family: var(--font-khmer);
      }

      h1,
      h2,
      h3,
      .font-display {
        font-family: var(--font-display);
      }
      .font-khmer {
        font-family: var(--font-khmer);
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
      }
      ul {
        list-style: none;
      }

      .container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 1.25rem;
      }
      @media (min-width: 640px) {
        .container {
          padding: 0 1.5rem;
        }
      }
      @media (min-width: 1024px) {
        .container {
          padding: 0 2rem;
        }
      }

      .section {
        position: relative;
        overflow: hidden;
        padding: 5rem 0;
      }
      @media (min-width: 768px) {
        .section {
          padding: 6.5rem 0;
        }
      }
      .section-alt {
        background-color: var(--bg-alt);
      }

      .section-header {
        max-width: 48rem;
        margin: 0 auto 3.5rem;
        text-align: center;
      }

      /* Scroll Reveal Animation Class */
      [data-reveal] {
        opacity: 0;
        transform: translate3d(0, 28px, 0) scale(0.97);
        transition:
          opacity 0.75s var(--spring-ease),
          transform 0.75s var(--spring-ease);
        will-change: opacity, transform;
      }
      [data-reveal].revealed {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }

      /* Specular Apple Glass Sheen Utility (Hover Reflection) */
      .glass-sheen {
        position: relative;
        overflow: hidden;
      }
      .glass-sheen::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -75%;
        width: 55%;
        height: 200%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.34),
          transparent
        );
        transform: rotate(24deg);
        pointer-events: none;
        transition: left 0.75s var(--spring-ease);
      }
      .glass-sheen:hover::after {
        left: 135%;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.38rem 0.95rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        background: var(--glass-card-bg);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid var(--border-card);
        box-shadow: var(--glass-specular);
        color: var(--green-primary);
        transition:
          transform 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease);
      }
      .eyebrow:hover {
        transform: translateY(-2px) scale(1.03);
      }
      body.dark .eyebrow {
        color: var(--green-lime);
      }

      .section-title {
        font-size: clamp(1.6rem, 3.2vw, 2.35rem);
        font-weight: 700;
        margin-top: 1rem;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .section-subtitle {
        margin-top: 1rem;
        font-size: 0.98rem;
        color: var(--text-muted);
        line-height: 1.65;
      }

      /* ========================================================================
4. ANIMATED BANANA TREE & CASSAVA BACKGROUND LAYER
         ======================================================================== */
      .botanical-bg-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .parallax-wrap {
        position: absolute;
        will-change: transform;
        pointer-events: none;
      }

      .botanical-item {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .botanical-item img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        transition:
          opacity 0.5s ease,
          filter 0.5s ease;
      }

      /* Banana Tree Breeze Sway */
      .botanical-banana {
        transform-origin: bottom center;
        animation: bananaSway 8.5s ease-in-out infinite;
      }
      .botanical-banana.flipped {
        animation: bananaSwayFlipped 9.5s ease-in-out infinite;
      }

      /* Cassava Root Floating Drift */
      .botanical-cassava {
        transform-origin: center center;
        animation: cassavaFloat 10.5s ease-in-out infinite;
      }
      .botanical-cassava.flipped {
        animation: cassavaFloatFlipped 11.5s ease-in-out infinite;
      }

      /* Visibility & Depth Styling on Dark Emerald Sections (Hero & Vision) */
      .botanical-bg-layer.on-dark .botanical-banana img {
        opacity: 0.3;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.42)) saturate(1.15);
      }
      .botanical-bg-layer.on-dark .botanical-cassava img {
        opacity: 0.28;
        filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.45)) brightness(1.12)
          contrast(1.05);
      }
      .botanical-bg-layer.on-dark .botanical-soft img {
        opacity: 0.16;
        filter: blur(1.5px) drop-shadow(0 14px 28px rgba(0, 0, 0, 0.35));
      }

      /* Visibility & Depth Styling on Light/Dark Mode Sections (Process & Team) */
      .botanical-bg-layer.on-surface .botanical-banana img {
        opacity: 0.2;
        filter: drop-shadow(0 12px 24px rgba(6, 78, 54, 0.14));
      }
      .botanical-bg-layer.on-surface .botanical-cassava img {
        opacity: 0.18;
        filter: drop-shadow(0 12px 24px rgba(6, 78, 54, 0.14));
      }
      body.dark .botanical-bg-layer.on-surface .botanical-banana img {
        opacity: 0.18;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5)) brightness(0.92);
      }
      body.dark .botanical-bg-layer.on-surface .botanical-cassava img {
        opacity: 0.16;
        filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5)) brightness(1.05);
      }

      /* Safe Fallback if Opened Directly via file:// (Non-Server Mode) */
      .botanical-bg-layer.on-surface img.fallback-blend {
        mix-blend-mode: multiply;
      }
      body.dark .botanical-bg-layer.on-surface img.fallback-blend,
      .botanical-bg-layer.on-dark img.fallback-blend {
        mix-blend-mode: luminosity;
        opacity: 0.18;
        -webkit-mask-image: radial-gradient(
          ellipse 68% 68% at 50% 50%,
          #000 42%,
          transparent 76%
        );
        mask-image: radial-gradient(
          ellipse 68% 68% at 50% 50%,
          #000 42%,
          transparent 76%
        );
      }

      /* Responsive Scaling for Mobile Screens */
      @media (max-width: 767px) {
        .botanical-bg-layer .parallax-wrap {
          transform-origin: center;
          max-width: 62vw;
          opacity: 0.72;
        }
      }

      /* ========================================================================
5. HEADER / STICKY APPLE GLASS NAVBAR
         ======================================================================== */
      .navbar {
        position: sticky;
        top: 0;
        width: 100%;
        z-index: 50;
        background: rgba(5, 68, 47, 0.86);
        backdrop-filter: blur(22px) saturate(180%);
        -webkit-backdrop-filter: blur(22px) saturate(180%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
        transition:
          background 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease);
      }
      .navbar.scrolled {
        background: var(--nav-scrolled-bg);
        backdrop-filter: blur(24px) saturate(200%);
        -webkit-backdrop-filter: blur(24px) saturate(200%);
        border-bottom: 1px solid var(--nav-scrolled-border);
        box-shadow: var(--nav-scrolled-shadow);
      }
      .navbar-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 5rem;
      }
      @media (min-width: 768px) {
        .navbar-inner {
          height: 5.5rem;
        }
      }

      .brand-btn {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        text-align: left;
        transition: transform 0.3s var(--spring-ease);
      }
      .brand-btn:hover {
        transform: scale(1.03);
      }
      .brand-name {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        display: block;
      }
      .navbar.scrolled .brand-name {
        color: var(--green-dark);
      }
      body.dark .navbar.scrolled .brand-name {
        color: #ffffff;
      }

      .brand-sub {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--green-lime);
        display: block;
        margin-top: 0.25rem;
      }
      .navbar.scrolled .brand-sub {
        color: var(--green-primary);
      }
      body.dark .navbar.scrolled .brand-sub {
        color: var(--green-lime);
      }

      .nav-desktop {
        display: none;
        align-items: center;
        gap: 0.3rem;
      }
      @media (min-width: 900px) {
        .nav-desktop {
          display: flex;
        }
      }

      .nav-link {
        padding: 0.5rem 0.95rem;
        border-radius: 0.75rem;
        font-size: 0.88rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid transparent;
        transition: all 0.28s var(--spring-ease);
      }
      .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-1px);
      }
      .nav-link.active {
        color: var(--green-lime);
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .navbar.scrolled .nav-link {
        color: var(--nav-text-scrolled);
      }
      .navbar.scrolled .nav-link:hover {
        color: var(--green-primary);
        background: rgba(22, 128, 60, 0.1);
        border-color: rgba(22, 128, 60, 0.2);
      }
      body.dark .navbar.scrolled .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
      }
      .navbar.scrolled .nav-link.active {
        color: var(--green-primary);
        background: rgba(22, 128, 60, 0.14);
        border-color: rgba(22, 128, 60, 0.25);
        font-weight: 600;
      }
      body.dark .navbar.scrolled .nav-link.active {
        color: var(--green-lime);
        background: rgba(163, 217, 119, 0.16);
        border-color: rgba(163, 217, 119, 0.3);
      }

      .nav-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .ctrl-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.55rem 0.78rem;
        border-radius: 0.8rem;
        font-size: 0.75rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
        color: #ffffff;
        transition: all 0.28s var(--spring-ease);
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.26);
        transform: translateY(-2px) scale(1.04);
      }
      .navbar.scrolled .ctrl-btn {
        background: var(--control-bg-scrolled);
        border-color: var(--control-border-scrolled);
        color: var(--green-dark);
      }
      body.dark .navbar.scrolled .ctrl-btn {
        color: #eaf4ed;
      }
      .ctrl-btn.icon-only {
        padding: 0.6rem;
      }

      .mobile-menu-toggle {
        display: inline-flex;
      }
      @media (min-width: 900px) {
        .mobile-menu-toggle {
          display: none;
        }
      }

      .mobile-drawer {
        display: none;
        background: var(--nav-scrolled-bg);
        backdrop-filter: blur(22px) saturate(190%);
        -webkit-backdrop-filter: blur(22px) saturate(190%);
        border-bottom: 1px solid var(--nav-scrolled-border);
      }
      .mobile-drawer.open {
        display: block;
      }
      .mobile-drawer-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
        padding: 1rem;
      }
      .mobile-nav-link {
        padding: 0.65rem 0.9rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-align: left;
        color: var(--text-main);
        transition: all 0.25s var(--spring-ease);
      }
      .mobile-nav-link.active {
        background: var(--green-primary);
        color: #ffffff;
      }

      /* ========================================================================
6. HOME / HERO SECTION (ANIMATED AURORA + BANANA TREE & CASSAVA)
         ======================================================================== */
      .hero {
        position: relative;
        padding: 4.5rem 0 5rem;
        overflow: hidden;
        background: linear-gradient(
          -45deg,
          #043927,
          #064e36,
          #0e6739,
          #16803c,
          #095932
        );
        background-size: 320% 320%;
        animation: bgAuroraShift 14s ease infinite;
        color: #ffffff;
      }
      @media (min-width: 768px) {
        .hero {
          padding: 5.5rem 0 6.5rem;
        }
      }

      .hero-grid {
        position: relative;
        display: grid;
        grid-template-columns: 1fr;
        gap: 3rem;
        align-items: center;
      }
      @media (min-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Large Triple-Logo Apple Glass Pill in Hero (CPC + CAFST + KSIT, No Text) */
      .hero-logos-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.55rem 0.85rem;
        border-radius: 9999px;
        background: var(--glass-bg);
        border: 1.5px solid rgba(255, 255, 255, 0.42);
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
        box-shadow:
          0 14px 30px rgba(4, 38, 26, 0.25),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.65);
        margin-bottom: 1.35rem;
        transition:
          transform 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease);
      }
      @media (max-width: 420px) {
        .hero-logos-pill {
          gap: 0.55rem;
          padding: 0.45rem 0.65rem;
        }
      }
      .hero-logos-pill:hover {
        transform: translateY(-3px) scale(1.03);
        border-color: rgba(255, 255, 255, 0.85);
        box-shadow:
          0 18px 36px rgba(4, 38, 26, 0.35),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.9);
      }

      .hero-logo-slot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border-radius: 9999px;
        transition: transform 0.3s var(--spring-ease);
      }
      .hero-logo-slot:hover,
      .hero-logo-slot.drag-over {
        transform: scale(1.07);
      }

      .hero-logos-divider {
        width: 1px;
        height: 36px;
        background: rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
      }

      /* Standard Apple Glass Pill Badge (Vision & Footer) */
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.42rem 1.05rem 0.42rem 0.55rem;
        border-radius: 9999px;
        background: var(--glass-bg);
        border: 1px solid rgba(255, 255, 255, 0.38);
        backdrop-filter: blur(18px) saturate(190%);
        -webkit-backdrop-filter: blur(18px) saturate(190%);
        box-shadow:
          0 10px 24px rgba(4, 38, 26, 0.22),
          inset 0 1px 1px rgba(255, 255, 255, 0.55);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--green-lime);
        margin-bottom: 1.25rem;
        cursor: pointer;
        transition:
          transform 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease);
      }
      .hero-badge:hover,
      .hero-badge.drag-over {
        transform: translateY(-2px) scale(1.03);
        border-color: rgba(255, 255, 255, 0.85);
        box-shadow:
          0 14px 30px rgba(4, 38, 26, 0.32),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.9);
      }

      .cpc-logo-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        border-radius: 9999px;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.24);
      }

      .footer-badges-stack {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.65rem;
      }

      .hero-brand {
        font-size: 0.95rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--green-lime);
        margin-bottom: 0.5rem;
      }

      .hero-title {
        font-size: clamp(2rem, 4.5vw, 3.35rem);
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -0.02em;
        margin-bottom: 1.25rem;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
      }

      .hero-subtitle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.1rem;
        font-weight: 500;
        color: #d9f2c7;
        margin-bottom: 1rem;
      }

      .hero-desc {
        font-size: 0.98rem;
        color: rgba(255, 255, 255, 0.88);
        max-width: 36rem;
        line-height: 1.7;
        margin-bottom: 1.75rem;
      }

      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem;
        margin-bottom: 1.75rem;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.55rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, #b6e68e 0%, #96d166 100%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        color: var(--green-dark);
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow:
          0 12px 26px rgba(0, 0, 0, 0.22),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.8);
        transition:
          transform 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease),
          filter 0.35s var(--spring-ease);
      }
      .btn-primary:hover {
        transform: translateY(-3px) scale(1.03);
        box-shadow:
          0 18px 34px rgba(0, 0, 0, 0.3),
          inset 0 2px 1px rgba(255, 255, 255, 0.95);
        filter: brightness(1.04);
      }

      .btn-outline-light {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.9rem 1.55rem;
        border-radius: 1rem;
        background: var(--glass-bg);
        border: 1px solid rgba(255, 255, 255, 0.42);
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
        box-shadow:
          0 10px 24px rgba(4, 38, 26, 0.2),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.52);
        transition:
          transform 0.35s var(--spring-ease),
          background 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease);
      }
      .btn-outline-light:hover {
        background: rgba(255, 255, 255, 0.24);
        border-color: rgba(255, 255, 255, 0.78);
        transform: translateY(-3px) scale(1.03);
        box-shadow:
          0 16px 32px rgba(4, 38, 26, 0.32),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.85);
      }

      .hero-badges-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
      }
      .hero-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.42rem;
        padding: 0.45rem 0.9rem;
        border-radius: 0.85rem;
        background: var(--glass-bg);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.32);
        box-shadow:
          0 8px 20px rgba(4, 38, 26, 0.18),
          inset 0 1px 1px rgba(255, 255, 255, 0.48);
        font-size: 0.78rem;
        font-weight: 500;
        transition:
          transform 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease);
      }
      .hero-pill:hover {
        transform: translateY(-3px) scale(1.04);
        border-color: rgba(255, 255, 255, 0.75);
        box-shadow:
          0 12px 26px rgba(4, 38, 26, 0.28),
          inset 0 1px 1px rgba(255, 255, 255, 0.8);
      }

      .hero-visual-wrap {
        position: relative;
        max-width: 34rem;
        margin: 0 auto;
        width: 100%;
      }
      @media (min-width: 1024px) {
        .hero-visual-wrap {
          max-width: none;
        }
      }

      /* Apple Glass Frame around Hero Image */
      .hero-image-card {
        position: relative;
        border-radius: 1.75rem;
        overflow: hidden;
        padding: 0.5rem;
        background: var(--glass-bg);
        backdrop-filter: blur(22px) saturate(190%);
        -webkit-backdrop-filter: blur(22px) saturate(190%);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        box-shadow:
          0 28px 56px rgba(4, 38, 26, 0.36),
          inset 0 2px 2px rgba(255, 255, 255, 0.65);
        transition:
          transform 0.45s var(--spring-ease),
          box-shadow 0.45s var(--spring-ease),
          border-color 0.45s var(--spring-ease);
      }
      .hero-image-card:hover {
        transform: translateY(-6px) scale(1.015);
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow:
          0 36px 68px rgba(4, 38, 26, 0.46),
          inset 0 2px 3px rgba(255, 255, 255, 0.9);
      }
      .hero-image-inner {
        position: relative;
        border-radius: 1.35rem;
        overflow: hidden;
      }
      .hero-image-card img {
        width: 100%;
        height: 360px;
        object-fit: cover;
        transition: transform 0.65s var(--spring-ease);
      }
      .hero-image-card:hover img {
        transform: scale(1.04);
      }
      @media (min-width: 1024px) {
        .hero-image-card img {
          height: 440px;
        }
      }

      .hero-image-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(6, 78, 54, 0.82),
          transparent 55%
        );
      }
      .hero-image-overlay {
        position: absolute;
        bottom: 1.1rem;
        left: 1.1rem;
        right: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.1rem;
        border-radius: 1.15rem;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.28) 0%,
          rgba(255, 255, 255, 0.1) 100%
        );
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.42);
        box-shadow:
          0 12px 28px rgba(0, 0, 0, 0.22),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.65);
        transition:
          transform 0.35s var(--spring-ease),
          border-color 0.35s var(--spring-ease);
      }
      .hero-image-card:hover .hero-image-overlay {
        transform: translateY(-3px);
        border-color: rgba(255, 255, 255, 0.78);
      }
      .hero-overlay-tag {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--green-lime);
        font-weight: 600;
      }
      .hero-overlay-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin-top: 0.15rem;
      }
      .hero-overlay-icon {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.85rem;
        background: var(--green-lime);
        color: var(--green-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
        transition: transform 0.45s var(--spring-ease);
      }
      .hero-image-card:hover .hero-overlay-icon {
        transform: rotate(90deg) scale(1.06);
      }

      /* Floating Apple Glass Badge */
      .floating-eco-card {
        display: none;
        align-items: center;
        gap: 0.7rem;
        padding: 0.8rem 1.1rem;
        border-radius: 1.15rem;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(240, 250, 243, 0.74) 100%
        );
        backdrop-filter: blur(20px) saturate(190%);
        -webkit-backdrop-filter: blur(20px) saturate(190%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        color: var(--green-dark);
        box-shadow:
          0 20px 38px rgba(4, 38, 26, 0.25),
          inset 0 1.5px 1px rgba(255, 255, 255, 1);
        position: absolute;
        top: -1.25rem;
        left: -1.25rem;
        z-index: 3;
        animation: gentleBob 4.8s ease-in-out infinite;
        transition:
          transform 0.35s var(--spring-ease),
          box-shadow 0.35s var(--spring-ease);
      }
      .floating-eco-card:hover {
        animation-play-state: paused;
        transform: translateY(-5px) scale(1.05);
        box-shadow:
          0 26px 46px rgba(4, 38, 26, 0.32),
          inset 0 2px 2px rgba(255, 255, 255, 1);
      }
      @media (min-width: 640px) {
        .floating-eco-card {
          display: flex;
        }
      }
      .floating-eco-icon {
        width: 2.35rem;
        height: 2.35rem;
        border-radius: 0.8rem;
        background: linear-gradient(135deg, #dcf5e3, #bfecc9);
        color: var(--green-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
      }

      /* ========================================================================
7. PROCESS SECTION (DEDICATED 1-PAGE SPACE BETWEEN HOME & TEAM — STEPS 1 TO 7)
         ======================================================================== */
      .process-section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background-color: var(--bg-page);
      }

      .process-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 1.5rem;
        position: relative;
      }

      .process-card {
        width: 100%;
        max-width: 380px;
        padding: 1.15rem 1.15rem 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        position: relative;
        cursor: pointer;
      }
      @media (min-width: 640px) {
        .process-card {
          width: calc(50% - 0.75rem);
          max-width: none;
        }
      }
      @media (min-width: 1024px) {
        .process-card {
          width: calc(25% - 1.125rem);
        }
      }

      .process-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: var(--green-bright);
        box-shadow:
          0 22px 44px rgba(22, 128, 60, 0.2),
          inset 0 2px 2px rgba(255, 255, 255, 0.95);
      }
      body.dark .process-card:hover {
        border-color: var(--green-lime);
        box-shadow:
          0 22px 44px rgba(0, 0, 0, 0.55),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.35);
      }

      .process-photo-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 1.1rem;
        overflow: hidden;
        margin-bottom: 1.15rem;
        background: linear-gradient(
          135deg,
          rgba(22, 128, 60, 0.15),
          rgba(163, 217, 119, 0.22)
        );
        border: 1px solid rgba(255, 255, 255, 0.45);
      }

      .process-photo-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.55s var(--spring-ease);
      }

      .process-card:hover .process-photo-wrap img {
        transform: scale(1.07);
      }

      .process-photo-fallback {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        color: var(--green-primary);
      }
      body.dark .process-photo-fallback {
        color: var(--green-lime);
      }

      .process-step-badge {
        position: absolute;
        top: 0.65rem;
        left: 0.65rem;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.34rem 0.78rem;
        border-radius: 9999px;
        font-family: var(--font-display);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(5, 68, 47, 0.84);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.42);
        color: var(--green-lime);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      }

      .process-zoom-badge {
        position: absolute;
        bottom: 0.6rem;
        right: 0.6rem;
        width: 2rem;
        height: 2rem;
        border-radius: 0.65rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--green-dark);
        opacity: 0.85;
        transition:
          transform 0.3s var(--spring-ease),
          opacity 0.3s var(--spring-ease);
      }
      .process-card:hover .process-zoom-badge {
        opacity: 1;
        transform: scale(1.08);
      }

      .process-card-title {
        font-size: 1.08rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        line-height: 1.3;
      }

      .process-card-desc {
        font-size: 0.88rem;
        color: var(--text-muted);
        line-height: 1.62;
        margin-bottom: 1.1rem;
      }

      .process-card-tag {
        margin-top: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.76rem;
        font-weight: 600;
        color: var(--green-primary);
      }
      body.dark .process-card-tag {
        color: var(--green-lime);
      }

      /* Process Lightbox Modal */
      .lightbox-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background: rgba(4, 24, 16, 0.78);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
      }
      .lightbox-backdrop.open {
        display: flex;
      }
      .lightbox-dialog {
        position: relative;
        width: 100%;
        max-width: 760px;
        border-radius: 1.75rem;
        padding: 1.25rem;
        background: var(--glass-card-bg);
        border: 1.5px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 32px 64px rgba(0, 0, 0, 0.45);
        color: var(--text-main);
      }
      .lightbox-img-box {
        width: 100%;
        max-height: 60vh;
        border-radius: 1.25rem;
        overflow: hidden;
        background: #08120d;
        margin-bottom: 1.15rem;
      }
      .lightbox-img-box img {
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        margin: 0 auto;
      }
      .lightbox-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .lightbox-nav {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .lightbox-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        padding: 0.55rem 0.95rem;
        border-radius: 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        background: rgba(22, 128, 60, 0.14);
        border: 1px solid var(--border-card);
        color: var(--text-main);
        transition: all 0.25s var(--spring-ease);
      }
      .lightbox-btn:hover {
        background: var(--green-primary);
        color: #ffffff;
      }

      /* ========================================================================
8. OUR TEAM SECTION (ADVISOR + APPLE GLASS CARDS + HOVER & SCROLL ANIMATIONS)
         ======================================================================== */
      .card {
        background: var(--glass-card-bg);
        backdrop-filter: blur(20px) saturate(185%);
        -webkit-backdrop-filter: blur(20px) saturate(185%);
        border: 1.5px solid var(--border-card);
        border-radius: 1.65rem;
        box-shadow: var(--glass-specular);
        transition:
          transform 0.4s var(--spring-ease),
          box-shadow 0.4s var(--spring-ease),
          border-color 0.4s var(--spring-ease),
          background 0.4s var(--spring-ease);
      }

      /* Featured Project Advisor Row */
      .advisor-row {
        display: flex;
        justify-content: center;
        margin-bottom: 2.25rem;
      }

      .team-card.is-advisor {
        width: 100%;
        max-width: 340px;
        border-color: rgba(202, 152, 42, 0.42);
      }
      body.dark .team-card.is-advisor {
        border-color: rgba(235, 195, 92, 0.42);
      }

      .team-card.is-advisor .avatar-ring {
        width: 8rem;
        height: 8rem;
        background: linear-gradient(
          135deg,
          #b8861e,
          #e3b94f,
          var(--green-primary)
        );
        box-shadow: 0 12px 26px rgba(184, 134, 30, 0.28);
      }

      .team-card.is-advisor:hover {
        border-color: #d4a638;
        box-shadow:
          0 24px 48px rgba(184, 134, 30, 0.22),
          inset 0 2px 2px rgba(255, 255, 255, 0.95);
      }
      body.dark .team-card.is-advisor:hover {
        border-color: #ebc35c;
        box-shadow:
          0 24px 48px rgba(0, 0, 0, 0.6),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.35);
      }

      .team-badge.advisor-badge {
        background: linear-gradient(
          135deg,
          rgba(212, 166, 56, 0.2),
          rgba(22, 128, 60, 0.14)
        );
        border: 1px solid rgba(202, 152, 42, 0.45);
        color: #8f640d;
      }
      body.dark .team-badge.advisor-badge {
        background: linear-gradient(
          135deg,
          rgba(235, 195, 92, 0.22),
          rgba(163, 217, 119, 0.14)
        );
        border-color: rgba(235, 195, 92, 0.45);
        color: #f3d27a;
      }

      .team-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 1.5rem;
      }

      .team-card {
        width: 100%;
        max-width: 360px;
        padding: 1.85rem 1.25rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      @media (min-width: 640px) {
        .team-card:not(.is-advisor) {
          width: calc(50% - 0.75rem);
          max-width: none;
        }
      }
      @media (min-width: 1024px) {
        .team-card:not(.is-advisor) {
          width: calc(25% - 1.125rem);
        }
      }

      /* Hover effect applied consistently across team member boxes */
      .team-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: var(--green-bright);
        box-shadow:
          0 22px 44px rgba(22, 128, 60, 0.2),
          inset 0 2px 2px rgba(255, 255, 255, 0.95);
      }
      body.dark .team-card:hover {
        border-color: var(--green-lime);
        box-shadow:
          0 22px 44px rgba(0, 0, 0, 0.55),
          inset 0 1.5px 1px rgba(255, 255, 255, 0.35);
      }

      .team-card.is-developer {
        cursor: pointer;
      }

      .avatar-wrap {
        position: relative;
        margin-bottom: 1.25rem;
      }
      .avatar-ring {
        width: 7.25rem;
        height: 7.25rem;
        border-radius: 9999px;
        background: linear-gradient(
          135deg,
          var(--green-dark),
          var(--green-primary),
          var(--green-bright)
        );
        padding: 4px;
        box-shadow: 0 10px 22px rgba(22, 128, 60, 0.22);
        transition:
          transform 0.45s var(--spring-ease),
          box-shadow 0.45s var(--spring-ease);
      }
      .team-card:hover .avatar-ring {
        transform: scale(1.07) rotate(3deg);
        box-shadow: 0 14px 28px rgba(22, 128, 60, 0.32);
      }
      .avatar-inner {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: var(--team-avatar-bg);
        color: var(--green-primary);
        display: flex;
        align-items: center;

      /* Automatically strips white backgrounds from banana-tree.jpg & cassava.jpg */
      function processBotanicalImg(imgEl, baseName) {
        if (imgEl.dataset.cleaned === "true") return;

        if (cleanedBotanicalCache[baseName]) {
          imgEl.dataset.cleaned = "true";
          imgEl.src = cleanedBotanicalCache[baseName];
          return;
        }

        try {
          const w = imgEl.naturalWidth;
          const h = imgEl.naturalHeight;
          if (!w || !h) return;

          // Resize to max 900px on offscreen canvas for smooth performance
          const scale = Math.min(1, 900 / Math.max(w, h));
          const cw = Math.round(w * scale);
          const ch = Math.round(h * scale);

          const canvas = document.createElement("canvas");
          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(imgEl, 0, 0, cw, ch);

          const imgData = ctx.getImageData(0, 0, cw, ch);
          const data = imgData.data;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const a = data[i + 3];
            if (a === 0) continue;

            const maxC = Math.max(r, g, b);
            const minC = Math.min(r, g, b);
            const lum = (r + g + b) / 3;
            const sat = maxC - minC;

            // Remove white backdrop & light neutral gray ground shadow cleanly
            if (lum > 236 && sat < 22) {
              data[i + 3] = 0;
            } else if (lum > 198 && sat < 18) {
              const t = (236 - lum) / (236 - 198);
              data[i + 3] = Math.round(a * t * t);
            }
          }

          ctx.putImageData(imgData, 0, 0);
          const cleanUrl = canvas.toDataURL("image/png");
          cleanedBotanicalCache[baseName] = cleanUrl;

          document
            .querySelectorAll(`img[data-botanical="${baseName}"]`)
            .forEach((el) => {
              el.dataset.cleaned = "true";
              el.classList.remove("fallback-blend");
              el.src = cleanUrl;
            });
        } catch (err) {
          // Graceful CSS fallback if opened directly via file:// protocol
          imgEl.classList.add("fallback-blend");
        }
      }

      /* Smart fallback loader for banana-tree & cassava (.jpg -> .png -> .jpeg -> .webp) */
      function handleBotanicalError(imgEl, baseName) {
        const tried = parseInt(imgEl.getAttribute("data-tried") || "0", 10);
        const exts = [".png", ".jpeg", ".webp"];
        if (tried < exts.length) {
          imgEl.setAttribute("data-tried", String(tried + 1));
          imgEl.src = `image/${baseName}${exts[tried]}`;
        } else {
          imgEl.style.display = "none";
        }
      }

      function renderBotanicalProp({
        type,
        wrapStyle,
        parallax = 0.25,
        rotate = 0.12,
        flipped = false,
        soft = false,
        delay = "0s",
      }) {
        const baseName = type === "banana" ? "banana-tree" : "cassava";
        const initialSrc =
          cleanedBotanicalCache[baseName] || `image/${baseName}.jpg`;
        const isAlreadyCleaned = Boolean(cleanedBotanicalCache[baseName]);
        const cls = [
          "botanical-item",
          type === "banana" ? "botanical-banana" : "botanical-cassava",
          flipped ? "flipped" : "",
          soft ? "botanical-soft" : "",
        ]
          .filter(Boolean)
          .join(" ");

        return `
          <div class="parallax-wrap" data-parallax="${parallax}" data-rotate="${rotate}" style="${wrapStyle}">
            <div class="${cls}" style="animation-delay:${delay};">
              <img
                src="${initialSrc}"
                alt=""
                data-botanical="${baseName}"
                data-cleaned="${isAlreadyCleaned ? "true" : "false"}"
                onload="processBotanicalImg(this, '${baseName}')"
                onerror="handleBotanicalError(this, '${baseName}')"
              />
            </div>
          </div>
        `;
      }

      /* Scroll-Reveal Observer */
      let revealObserver = null;
      function initScrollReveal() {
        const targets = document.querySelectorAll("[data-reveal]");
        if (revealObserver) revealObserver.disconnect();

        if (!("IntersectionObserver" in window)) {
          targets.forEach((el) => el.classList.add("revealed"));
          return;
        }

        revealObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("revealed");
              }
            });
          },
          { threshold: 0.12, rootMargin: "0px 0px -30px 0px" },
        );

        targets.forEach((el) => revealObserver.observe(el));
      }

      /* Scroll-Driven Parallax Motion on All Banana Tree & Cassava Layers */
      function updateShapeParallax() {
        const parallaxItems = document.querySelectorAll("[data-parallax]");
        const vh = window.innerHeight || 800;

        parallaxItems.forEach((el) => {
          const rect = el.getBoundingClientRect();
          const speed = parseFloat(el.getAttribute("data-parallax")) || 0.15;
          const rot = parseFloat(el.getAttribute("data-rotate")) || 0.04;
          const offsetFromCenter = rect.top + rect.height / 2 - vh / 2;
          const translateY = Math.round(offsetFromCenter * speed * -0.32);
          const rotateDeg = (offsetFromCenter * rot * -0.04).toFixed(2);
          el.style.transform = `translate3d(0, ${translateY}px, 0) rotate(${rotateDeg}deg)`;
        });
      }

          if (isScrolled !== state.scrolled) {
            state.scrolled = isScrolled;

              .getElementById("navbar")
              .classList.toggle("scrolled", isScrolled);
            navNeedsUpdate = true;

            "hero",
            "process",
            "team",
            "conclusion",
            "footer",

          let current = "hero";
          for (const id of sectionIds) {
            const el = document.getElementById(id);
            if (el && el.getBoundingClientRect().top <= 160) {
              current = id;
            }
          }
          if (
            window.innerHeight + Math.round(y) >=
            document.body.offsetHeight - 40
          ) {
            current = "footer";
          }

          if (current !== state.activeSection) {
            state.activeSection = current;
            navNeedsUpdate = true;
          }

          if (navNeedsUpdate) {
            renderNav();
          }

          document
            .getElementById("backToTop")
            .classList.toggle("show", y > 350);

          if (!scrollTicking) {
            window.requestAnimationFrame(() => {
              updateShapeParallax();
              scrollTicking = false;
            });
            scrollTicking = true;
          }
        },
        { passive: true },
      );

      renderApp();
    </script>
  </body>
</html>
